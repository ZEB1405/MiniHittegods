
services:
  postgres:
    image: postgres:18
    container_name: minihittegods-db
    environment:
      POSTGRES_DB: minihittegods
      POSTGRES_USER: minihittegods
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minihittegods -d minihittegods"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
